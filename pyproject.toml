[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scdecage"
version = "0.1.0"
description = "Pathway-guided individual-level age prediction from single-cell transcriptomes"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "anndata>=0.10",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "timm>=1.0",
  "torch>=2.1",
]

[project.optional-dependencies]
preprocess = ["pyucell>=0.7", "scanpy>=1.10"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["scdecage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
